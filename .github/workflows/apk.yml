name: Build Android APK

# Builds an installable debug APK, a release APK and a Play Store .aab.
# Jobs run on pushes to main, pull requests, tag pushes (v*) and on demand.
# The release builds are signed when the signing secrets below are configured;
# the debug APK is always installable as-is.
#
# Optional secrets for signed releases (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of your .jks/.keystore   (base64 -w0 app.jks)
#   ANDROID_KEYSTORE_PASSWORD   store password
#   ANDROID_KEY_ALIAS           key alias
#   ANDROID_KEY_PASSWORD        key password
# Without them you still get a working debug APK (debug key) and an unsigned .aab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  apk:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web smoke test
        run: npm test

      - name: Build web payload
        run: npm run build

      - name: Add and sync the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate launcher icons and splash screens
        run: npm run assets

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK platform 35 and build tools are installed
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK: $SDK"
          if [ -x "$MANAGER" ]; then
            yes | "$MANAGER" --licenses >/dev/null 2>&1 || true
            "$MANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Stamp version name and code
        run: node scripts/android-version.mjs

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/android/ci-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE"
          {
            echo "KC_KEYSTORE=$KEYSTORE"
            echo "KC_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KC_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KC_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          // --- CI release signing (added by the Build Android APK workflow) ---
          android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv("KC_KEYSTORE") ?: "ci-release.keystore")
                      storePassword System.getenv("KC_STORE_PASSWORD")
                      keyAlias System.getenv("KC_KEY_ALIAS")
                      keyPassword System.getenv("KC_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease
                  }
              }
          }
          GRADLE
          grep -n "ciRelease" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # installable right away — signed with the debug key
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # signed when the secrets above are configured, unsigned otherwise
      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        if: ${{ !cancelled() }}
        run: node scripts/collect-android.mjs

      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kriticut-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kriticut-aab-${{ github.run_number }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach builds to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "KritiCut $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Android build"
            echo ""
            echo "- App version: \`$(node -p "require('./package.json').version")\`"
            echo "- Release signing: $([ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && echo "yes" || echo "no — debug APK is still installable")"
            echo ""
            if ls dist/* >/dev/null 2>&1; then
              echo "| File | Size |"
              echo "| --- | --- |"
              for f in dist/*; do
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            else
              echo "No artifacts were produced — check the Gradle logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
