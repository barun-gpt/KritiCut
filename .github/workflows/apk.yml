name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web payload
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Generate launcher icons and splash screens
        run: npm run assets

      - name: Set app version
        run: |
          sed -i 's/versionCode 1/versionCode 21/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.1.0"/' android/app/build.gradle

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KritiCut-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
