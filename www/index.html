 else if(ht=='tpl')h=`<h2>Templates</h2><div class=row>${['Trending','TikTok/Reels','Memes'].map(c=>`<button class="ch${hcat==c?' on':''}" data-hc="${c}">${c}</button>`).join('')}</div><div class=cards>${TPL.map((q,i)=>q.c==hcat?`<div class=tc data-tpl=${i} style="background:linear-gradient(135deg,${q.g})"><span>${q.e}</span><b>${q.n}</b><small>${q.ar} · ${q.s.length} clip slot${q.s.length>1?'s':''}</small></div>`:'').join('')}</div><p class=h>Pick a template, choose your clips and photos, and they are mapped to the slots and auto-cut to fit.</p>`;
 else{const set=`<div class=card><h3>Export settings</h3><label class=r2>Resolution<select data-cfg=res>${[[480,'480p'],[720,'720p'],[1080,'1080p (default)']].map(a=>`<option value=${a[0]}${cfg.res==a[0]?' selected':''}>${a[1]}</option>`).join('')}</select></label><label class=r2>Frame rate<select data-cfg=fps>${[24,30,60].map(f=>`<option value=${f}${cfg.fps==f?' selected':''}>${f} fps${f==30?' (default)':''}</option>`).join('')}</select></label></div><div class=card><h3>Cloud &amp; plan</h3><div class=r2><span>Cloud backup</span><button data-tg=cloud class="${cfg.cloud?'pri':''}">${cfg.cloud?'On':'Off'}</button></div><p class=h>Backup needs a KritiCut cloud server, which is not connected yet.</p><div class=r2><span>Plan: <b>${cfg.pro?'Pro':'Free'}</b></span><button data-tg=pro class="${cfg.pro?'pri':''}">${cfg.pro?'Switch to Free':'Upgrade to Pro'}</button></div><p class=h>Billing is not connected; this only changes the label.</p></div>`;
  h=`<h2>Profile</h2>`+(user?`<div class=card><div class=av>${esc(user.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div><h3>${esc(user.name)}</h3><p class=h>@${esc(user.u)} · ${esc(user.e)} · ${cfg.pro?'Pro':'Free'} plan</p><button class=big data-go=out>Sign out</button></div>`:`<div class=card><div class=av>👤</div><p>Create an account to personalise KritiCut.</p><div class=row><button class="${AUTH=='in'?'pri':''}" data-au=in>Sign in</button><button class="${AUTH=='up'?'pri':''}" data-au=up>Sign up</button></div>${AUTH=='up'?'<input class=ti id=fn placeholder="Full name"><input class=ti id=un2 placeholder="Username"><input class=ti id=em type=email placeholder="Email">':'<input class=ti id=li placeholder="Username or email">'}<input class=ti id=pw type=password placeholder="Password"><button class="pri big" data-go=${AUTH}>${AUTH=='up'?'Create account':'Sign in'}</button><p class=h>Accounts are stored on this device only (no server).</p></div>`)+set}
 hmain.innerHTML=h}
async function authGo(m){const g=i=>($('#'+i)?.value||'').trim(),us=(await kv('get','users'))||[],pw=$('#pw')?.value||'';
 if(m=='out'){user=null;await kv('del','sess');return home()}
 if(m=='up'){const name=g('fn'),u=g('un2').toLowerCase(),em=g('em').toLowerCase();if(name.length<2)return toast('Enter your full name');if(!/^[a-z0-9_.]{3,20}$/.test(u))return toast('Username: 3–20 letters, numbers, _ or .');if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email');if(pw.length<6)return toast('Password needs 6+ characters');if(us.some(q=>q.u==u||q.e==em))return toast('Username or email already used');
  const s=crypto.randomUUID?crypto.randomUUID():String(Math.random()),a={u,name,e:em,s,h:await hp(pw,s)};us.push(a);await kv('put','users',us);user=a}
 else{const id=g('li').toLowerCase(),a=us.find(q=>q.u==id||q.e==id);if(!a||a.h!=await hp(pw,a.s))return toast('Wrong username or password');user=a}
 await kv('put','sess',user.u);toast('Welcome, '+user.name.split(' ')[0]+'!');home()}
hmain.onchange=e=>{const k=e.target.dataset.cfg;if(k){cfg[k]=+e.target.value;kv('put','cfg',cfg)}};
hmain.onclick=async e=>{const d=e.target.closest('[data-new],[data-q],[data-hs],[data-hc],[data-open],[data-view],[data-tpl],[data-del],[data-au],[data-go],[data-tg]');if(!d)return;const s=d.dataset;
 if(s.del){e.stopPropagation();if(!confirm('Delete this '+(s.kind=='r'?'rendered video':'project')+'?'))return;if(s.kind=='r'){await kv('del','r:'+s.del);await kv('put','rend',((await kv('get','rend'))||[]).filter(q=>q.id!=s.del))}else{await kv('del','p:'+s.del);await kv('put','idx',((await kv('get','idx'))||[]).filter(q=>q.id!=s.del))}return home()}
 if(s.new){impMode='new';return pickF('video/*,image/*',1)}
 if(s.q){impMode='q:'+s.q;return pickF('video/*',0)}
 if(s.tpl){impMode='tpl:'+s.tpl;return pickF('video/*,image/*',1)}
 if(s.hs){hs=s.hs;return home()}if(s.hc){hcat=s.hc;return home()}
 if(s.tg){cfg[s.tg]=!cfg[s.tg];await kv('put','cfg',cfg);return home()}
 if(s.open)return openProject(s.open);
 if(s.view!=null){out=await kv('get','r:'+s.view);if(!out)return toast('File missing');return show(`<video controls playsinline src="${URL.createObjectURL(out)}"></video><div class=row><button class=pri data-x=save>Save / Share</button><button data-x=close>Close</button></div>`)}
 if(s.au){AUTH=s.au;return home()}if(s.go)authGo(s.go)};
function leaveEd(){inEd=false;ov.style.display='none';$('#ed').style.display='none';$('#hm').style.display='flex';home()}
const ox=ov.onclick;ov.onclick=async e=>{const a=e.target.dataset.x;
 if(a=='sd'){await saveNow();leaveEd()}else if(a=='dc'){if(P){await kv('del','p:'+P.id);await kv('put','idx',((await kv('get','idx'))||[]).filter(q=>q.id!=P.id))}leaveEd()}else if(a=='ke')ov.style.display='none';else if(a=='qc'){qc=1;qstop&&qstop()}else ox(e)};
$('#bt').onclick=e=>{if(e.target.dataset.h){ht=e.target.dataset.h;home()}};
(async()=>{const n=await kv('get','sess');if(n)user=((await kv('get','users'))||[]).find(q=>q.u==n)||null;Object.assign(cfg,(await kv('get','cfg'))||{});home();requestAnimationFrame(tick)})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
